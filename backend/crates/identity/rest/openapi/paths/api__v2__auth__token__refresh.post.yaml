tags:
- auth
operationId: nativeAccountTokenRefresh
summary: Rotate native Account browser authority
description: 'Requires the refresh cookie and a verified X-Console-CSRF proof. A supplied session
  cookie must verify its signature/kind/time structure and match the live Account/family/generation;
  correctly signed expired access is accepted alongside current same-family refresh authority. Malformed,
  signature-invalid, kind-invalid, otherwise time-invalid or mismatched access is refused. Rotates
  the refresh token and returns current Account authority. Reuse detection deliberately commits family
  revocation and evidence before returning authentication_invalid (401); error responses are not universally
  side-effect-free. Cookie-only native Account transport. Any Authorization header or duplicate recognized
  Account cookie is refused as ambiguous_credentials. Combined Cookie header bytes, including separators,
  are bounded to 16 KiB. Legacy console_refresh is never Account authority. Only cookie values consumed
  by the operation are validated as credentials. Responses are JSON with Cache-Control: no-store,
  Pragma: no-cache, X-Content-Type-Options: nosniff and Vary: Cookie, Origin. Owner transactions complete
  before success responses/cookies are released. A commit transport failure returns authority_unavailable
  and may leave outcome uncertain; blind mutation replay is not safe. Required Origin must equal the
  configured HTTPS origin exactly. Content-Type must be exactly application/json, without parameters.
  Sec-Fetch-Site may be absent; if supplied it must be same-origin. Top-level request must be a JSON
  object with no unknown or duplicate app-owned fields. The entire body is bounded even without Content-Length;
  lexical JSON nesting is at most 32. Nested WebAuthn types use the pinned library decoder; see their
  schema descriptions.'
security:
- nativeAccountRefresh: []
parameters:
- name: Origin
  in: header
  required: true
  description: Exact configured HTTPS origin; duplicate or invalid values are refused.
  schema:
    type: string
    format: uri
- name: Sec-Fetch-Site
  in: header
  required: false
  description: If supplied, exactly same-origin; duplicate values are refused.
  schema:
    type: string
    enum:
    - same-origin
- name: X-Console-CSRF
  in: header
  required: true
  description: Single header value; total header bytes bounded to 4096. For mutations Auth verifies
    signature/time and live Account/family/generation binding.
  schema:
    type: string
    minLength: 1
    maxLength: 4096
responses:
  '200':
    description: Committed native Account response.
    headers:
      Cache-Control:
        schema:
          type: string
          const: no-store
      Pragma:
        schema:
          type: string
          const: no-cache
      X-Content-Type-Options:
        schema:
          type: string
          const: nosniff
      Vary:
        schema:
          type: string
          const: Cookie, Origin
      Set-Cookie:
        description: Repeated Set-Cookie field lines replace native session (SameSite=Lax) and refresh
          (SameSite=Strict), both Secure; HttpOnly; Path=/ with actual bounded expiry and no Domain.
          Never comma-fold Set-Cookie lines.
        schema:
          type: string
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/NativeAccountEstablished'
  '400':
    description: 'Applicable native error codes: ambiguous_credentials.'
    headers:
      Cache-Control:
        schema:
          type: string
          const: no-store
      Pragma:
        schema:
          type: string
          const: no-cache
      X-Content-Type-Options:
        schema:
          type: string
          const: nosniff
      Vary:
        schema:
          type: string
          const: Cookie, Origin
    content:
      application/json:
        schema:
          allOf:
          - $ref: '#/components/schemas/NativeAccountError'
          - type: object
            properties:
              error:
                type: object
                properties:
                  code:
                    type: string
                    enum:
                    - ambiguous_credentials
        examples:
          ambiguous_credentials:
            value:
              error:
                code: ambiguous_credentials
                message: Credential transport is ambiguous.
  '401':
    description: 'Applicable native error codes: authentication_invalid.'
    headers:
      Cache-Control:
        schema:
          type: string
          const: no-store
      Pragma:
        schema:
          type: string
          const: no-cache
      X-Content-Type-Options:
        schema:
          type: string
          const: nosniff
      Vary:
        schema:
          type: string
          const: Cookie, Origin
    content:
      application/json:
        schema:
          allOf:
          - $ref: '#/components/schemas/NativeAccountError'
          - type: object
            properties:
              error:
                type: object
                properties:
                  code:
                    type: string
                    enum:
                    - authentication_invalid
        examples:
          authentication_invalid:
            value:
              error:
                code: authentication_invalid
                message: Authentication is invalid.
  '403':
    description: 'Applicable native error codes: request_origin_denied, csrf_invalid.'
    headers:
      Cache-Control:
        schema:
          type: string
          const: no-store
      Pragma:
        schema:
          type: string
          const: no-cache
      X-Content-Type-Options:
        schema:
          type: string
          const: nosniff
      Vary:
        schema:
          type: string
          const: Cookie, Origin
    content:
      application/json:
        schema:
          allOf:
          - $ref: '#/components/schemas/NativeAccountError'
          - type: object
            properties:
              error:
                type: object
                properties:
                  code:
                    type: string
                    enum:
                    - request_origin_denied
                    - csrf_invalid
        examples:
          request_origin_denied:
            value:
              error:
                code: request_origin_denied
                message: Request origin is denied.
          csrf_invalid:
            value:
              error:
                code: csrf_invalid
                message: Request proof is invalid.
  '413':
    description: 'Applicable native error codes: request_too_large.'
    headers:
      Cache-Control:
        schema:
          type: string
          const: no-store
      Pragma:
        schema:
          type: string
          const: no-cache
      X-Content-Type-Options:
        schema:
          type: string
          const: nosniff
      Vary:
        schema:
          type: string
          const: Cookie, Origin
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/ErrorBody'
          allOf:
          - $ref: '#/components/schemas/NativeAccountError'
          - type: object
            properties:
              error:
                type: object
                properties:
                  code:
                    type: string
                    enum:
                    - request_too_large
        examples:
          request_too_large:
            value:
              error:
                code: request_too_large
                message: Request exceeds the supported size.
  '422':
    description: 'Applicable native error codes: invalid_request.'
    headers:
      Cache-Control:
        schema:
          type: string
          const: no-store
      Pragma:
        schema:
          type: string
          const: no-cache
      X-Content-Type-Options:
        schema:
          type: string
          const: nosniff
      Vary:
        schema:
          type: string
          const: Cookie, Origin
    content:
      application/json:
        schema:
          allOf:
          - $ref: '#/components/schemas/NativeAccountError'
          - type: object
            properties:
              error:
                type: object
                properties:
                  code:
                    type: string
                    enum:
                    - invalid_request
        examples:
          invalid_request:
            value:
              error:
                code: invalid_request
                message: Request is invalid.
  '429':
    description: 'Applicable native error codes: rate_limited.'
    headers:
      Retry-After:
        description: Conservative delay in seconds for the one-minute rate-limit window.
        schema:
          type: string
          const: '60'
      Cache-Control:
        schema:
          type: string
          const: no-store
      Pragma:
        schema:
          type: string
          const: no-cache
      X-Content-Type-Options:
        schema:
          type: string
          const: nosniff
      Vary:
        schema:
          type: string
          const: Cookie, Origin
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/ErrorBody'
          allOf:
          - $ref: '#/components/schemas/NativeAccountError'
          - type: object
            properties:
              error:
                type: object
                properties:
                  code:
                    type: string
                    enum:
                    - rate_limited
        examples:
          rate_limited:
            value:
              error:
                code: rate_limited
                message: Request rate is exceeded.
  '503':
    description: 'Applicable native error codes: authority_unavailable.'
    headers:
      Cache-Control:
        schema:
          type: string
          const: no-store
      Pragma:
        schema:
          type: string
          const: no-cache
      X-Content-Type-Options:
        schema:
          type: string
          const: nosniff
      Vary:
        schema:
          type: string
          const: Cookie, Origin
    content:
      application/json:
        schema:
          allOf:
          - $ref: '#/components/schemas/NativeAccountError'
          - type: object
            properties:
              error:
                type: object
                properties:
                  code:
                    type: string
                    enum:
                    - authority_unavailable
        examples:
          authority_unavailable:
            value:
              error:
                code: authority_unavailable
                message: Account authority is unavailable.
requestBody:
  required: true
  description: Exact application/json Content-Type; maximum 4096 body bytes and JSON nesting depth
    32.
  content:
    application/json:
      schema:
        $ref: '#/components/schemas/NativeAccountEmptyInput'
