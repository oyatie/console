      X-Content-Type-Options:
        schema:
          type: string
          const: nosniff
      Vary:
        schema:
          type: string
          const: Cookie, Origin
    content:
      application/json:
        schema:
          allOf:
          - $ref: '#/components/schemas/NativeAccountError'
          - type: object
            properties:
              error:
