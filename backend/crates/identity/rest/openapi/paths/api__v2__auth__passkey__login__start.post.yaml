tags:
- auth
operationId: nativeAccountPasskeyLoginStart
summary: Start discoverable native Account login
description: 'Takes exactly an empty object and creates a discoverable passkey ceremony with conditional
  mediation. This operation does not require an anonymous Account. The start owner can refuse expired
  or invalid-origin authority as authentication_invalid. Cookie-only native Account transport. Any
  Authorization header or duplicate recognized Account cookie is refused as ambiguous_credentials.
  Combined Cookie header bytes, including separators, are bounded to 16 KiB. Legacy console_refresh
  is never Account authority. Only cookie values consumed by the operation are validated as credentials.
  Responses are JSON with Cache-Control: no-store, Pragma: no-cache, X-Content-Type-Options: nosniff
  and Vary: Cookie, Origin. Owner transactions complete before success responses/cookies are released.
  A commit transport failure returns authority_unavailable and may leave outcome uncertain; blind
  mutation replay is not safe. Required Origin must equal the configured HTTPS origin exactly. Content-Type
  must be exactly application/json, without parameters. Sec-Fetch-Site may be absent; if supplied
  it must be same-origin. Top-level request must be a JSON object with no unknown or duplicate app-owned
  fields. The entire body is bounded even without Content-Length; lexical JSON nesting is at most
  32. Nested WebAuthn types use the pinned library decoder; see their schema descriptions.'
security: []
parameters:
- name: Origin
  in: header
  required: true
  description: Exact configured HTTPS origin; duplicate or invalid values are refused.
  schema:
    type: string
    format: uri
- name: Sec-Fetch-Site
  in: header
  required: false
  description: If supplied, exactly same-origin; duplicate values are refused.
  schema:
    type: string
    enum:
    - same-origin
responses:
  '200':
    description: Committed native Account response.
    headers:
      Cache-Control:
        schema:
          type: string
          const: no-store
      Pragma:
        schema:
          type: string
          const: no-cache
      X-Content-Type-Options:
        schema:
          type: string
          const: nosniff
      Vary:
        schema:
          type: string
          const: Cookie, Origin
      Set-Cookie:
        description: Issues the __Host-console_account_login nonce cookie with Secure; HttpOnly; Path=/;
          SameSite=Strict and a Max-Age bounded by ceremony expiry and 300 seconds.
        schema:
          type: string
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/NativeAccountLoginStart'
  '400':
    description: 'Applicable native error codes: ambiguous_credentials.'
    headers:
      Cache-Control:
        schema:
          type: string
          const: no-store
      Pragma:
        schema:
          type: string
          const: no-cache
      X-Content-Type-Options:
        schema:
          type: string
          const: nosniff
      Vary:
        schema:
          type: string
          const: Cookie, Origin
    content:
      application/json:
        schema:
          allOf:
          - $ref: '#/components/schemas/NativeAccountError'
          - type: object
            properties:
              error:
                type: object
                properties:
                  code:
                    type: string
                    enum:
                    - ambiguous_credentials
        examples:
          ambiguous_credentials:
            value:
              error:
                code: ambiguous_credentials
                message: Credential transport is ambiguous.
  '401':
