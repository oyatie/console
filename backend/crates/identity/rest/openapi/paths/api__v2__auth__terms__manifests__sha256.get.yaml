tags:
- auth
operationId: getTermsManifest
summary: Read an immutable terms manifest
description: >-
  Public, unauthenticated read of a registered retained manifest by its exact-byte
  SHA-256 digest. The response preserves the verified JSON bytes, at most 16384 bytes,
  with Content-Type application/json; charset=utf-8. Retained reads remain available
  independently of the current terms authority and passkey or signing configuration.
  This operation sets no cookies and does not redirect.
security: []
parameters:
- name: sha256
  in: path
  required: true
  description: SHA-256 digest of the exact artifact bytes, encoded as 64 lowercase hexadecimal characters.
  schema:
    type: string
    pattern: '^[0-9a-f]{64}$'
responses:
  '200':
    description: Exact verified bytes of the immutable manifest.
    headers:
      Cache-Control:
        schema:
          type: string
          enum: ['public, max-age=31536000, immutable']
      X-Content-Type-Options:
        schema:
          type: string
          enum: [nosniff]
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/TermsManifest'
  '404':
    description: The digest is invalid, or no artifact with this digest is registered while artifact metadata is available.
    headers:
      Cache-Control:
        schema:
          type: string
          enum: [no-store]
      Pragma:
        schema:
          type: string
          enum: [no-cache]
      X-Content-Type-Options:
        schema:
          type: string
          enum: [nosniff]
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/ErrorBody'
        example:
          error:
            code: not_found
            message: Terms artifact not found
  '503':
    description: Artifact metadata is unavailable, or the registered artifact is missing or invalid.
    headers:
      Cache-Control:
        schema:
          type: string
          enum: [no-store]
      Pragma:
        schema:
          type: string
          enum: [no-cache]
      X-Content-Type-Options:
        schema:
          type: string
          enum: [nosniff]
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/ErrorBody'
        example:
          error:
            code: authority_unavailable
            message: Terms authority unavailable
