tags:
- auth
operationId: nativeAccountRegistrationFinish
summary: Complete native Account registration
description: 'Verifies the enrollment nonce, ceremony, passkey and the exact current terms manifest/acknowledgment
  set before activating the persistent Account. Existing valid Account authority returns already_authenticated.
  No Company membership or employment is created by this response. Cookie-only native Account transport.
  Any Authorization header or duplicate recognized Account cookie is refused as ambiguous_credentials.
  Combined Cookie header bytes, including separators, are bounded to 16 KiB. Legacy console_refresh
  is never Account authority. Only cookie values consumed by the operation are validated as credentials.
  Responses are JSON with Cache-Control: no-store, Pragma: no-cache, X-Content-Type-Options: nosniff
  and Vary: Cookie, Origin. Owner transactions complete before success responses/cookies are released.
  A commit transport failure returns authority_unavailable and may leave outcome uncertain; blind
  mutation replay is not safe. Required Origin must equal the configured HTTPS origin exactly. Content-Type
  must be exactly application/json, without parameters. Sec-Fetch-Site may be absent; if supplied
  it must be same-origin. Top-level request must be a JSON object with no unknown or duplicate app-owned
  fields. The entire body is bounded even without Content-Length; lexical JSON nesting is at most
  32. Nested WebAuthn types use the pinned library decoder; see their schema descriptions.'
security:
- nativeAccountEnrollment: []
parameters:
- name: Origin
  in: header
  required: true
  description: Exact configured HTTPS origin; duplicate or invalid values are refused.
  schema:
    type: string
    format: uri
- name: Sec-Fetch-Site
  in: header
  required: false
  description: If supplied, exactly same-origin; duplicate values are refused.
  schema:
    type: string
    enum:
    - same-origin
responses:
  '201':
    description: Committed native Account response.
    headers:
      Cache-Control:
        schema:
          type: string
          const: no-store
      Pragma:
        schema:
          type: string
          const: no-cache
      X-Content-Type-Options:
        schema:
          type: string
          const: nosniff
      Vary:
        schema:
          type: string
          const: Cookie, Origin
      Set-Cookie:
        description: Repeated Set-Cookie field lines issue native session and refresh cookies and
          clear enrollment/login cookies. All have Secure, HttpOnly, Path=/ and no Domain; session
          is SameSite=Lax, others SameSite=Strict. Never comma-fold Set-Cookie lines.
        schema:
          type: string
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/NativeAccountEstablished'
  '400':
    description: 'Applicable native error codes: ambiguous_credentials.'
    headers:
      Cache-Control:
        schema:
          type: string
          const: no-store
      Pragma:
        schema:
          type: string
          const: no-cache
      X-Content-Type-Options:
        schema:
          type: string
          const: nosniff
      Vary:
        schema:
          type: string
          const: Cookie, Origin
    content:
      application/json:
        schema:
          allOf:
          - $ref: '#/components/schemas/NativeAccountError'
          - type: object
            properties:
              error:
                type: object
                properties:
                  code:
                    type: string
                    enum:
                    - ambiguous_credentials
        examples:
          ambiguous_credentials:
            value:
              error:
                code: ambiguous_credentials
                message: Credential transport is ambiguous.
  '401':
    description: 'Applicable native error codes: enrollment_invalid, authentication_invalid.'
    headers:
      Cache-Control:
        schema:
          type: string
          const: no-store
      Pragma:
        schema:
          type: string
          const: no-cache
      X-Content-Type-Options:
        schema:
          type: string
          const: nosniff
      Vary:
        schema:
          type: string
          const: Cookie, Origin
    content:
      application/json:
        schema:
          allOf:
          - $ref: '#/components/schemas/NativeAccountError'
          - type: object
            properties:
              error:
                type: object
                properties:
                  code:
                    type: string
                    enum:
                    - enrollment_invalid
                    - authentication_invalid
        examples:
          enrollment_invalid:
            value:
              error:
                code: enrollment_invalid
                message: Enrollment is invalid.
          authentication_invalid:
            value:
              error:
                code: authentication_invalid
                message: Authentication is invalid.
  '403':
    description: 'Applicable native error codes: request_origin_denied.'
    headers:
      Cache-Control:
        schema:
          type: string
          const: no-store
      Pragma:
        schema:
          type: string
          const: no-cache
      X-Content-Type-Options:
        schema:
          type: string
          const: nosniff
      Vary:
        schema:
          type: string
          const: Cookie, Origin
    content:
      application/json:
        schema:
          allOf:
          - $ref: '#/components/schemas/NativeAccountError'
          - type: object
            properties:
              error:
                type: object
                properties:
                  code:
                    type: string
                    enum:
                    - request_origin_denied
        examples:
          request_origin_denied:
            value:
              error:
                code: request_origin_denied
                message: Request origin is denied.
  '409':
    description: 'Applicable native error codes: already_authenticated, terms_changed.'
    headers:
      Cache-Control:
        schema:
          type: string
          const: no-store
      Pragma:
        schema:
          type: string
          const: no-cache
      X-Content-Type-Options:
        schema:
          type: string
          const: nosniff
      Vary:
        schema:
          type: string
          const: Cookie, Origin
    content:
      application/json:
        schema:
          allOf:
          - $ref: '#/components/schemas/NativeAccountError'
          - type: object
            properties:
              error:
                type: object
                properties:
                  code:
                    type: string
                    enum:
                    - already_authenticated
                    - terms_changed
        examples:
          already_authenticated:
            value:
              error:
                code: already_authenticated
                message: Account is already authenticated.
          terms_changed:
            value:
              error:
                code: terms_changed
                message: Terms have changed.
  '413':
    description: 'Applicable native error codes: request_too_large.'
    headers:
      Cache-Control:
        schema:
          type: string
          const: no-store
      Pragma:
        schema:
          type: string
          const: no-cache
      X-Content-Type-Options:
        schema:
          type: string
          const: nosniff
      Vary:
        schema:
          type: string
          const: Cookie, Origin
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/ErrorBody'
          allOf:
          - $ref: '#/components/schemas/NativeAccountError'
          - type: object
            properties:
              error:
                type: object
                properties:
                  code:
                    type: string
                    enum:
                    - request_too_large
        examples:
          request_too_large:
            value:
              error:
                code: request_too_large
                message: Request exceeds the supported size.
  '422':
    description: 'Applicable native error codes: invalid_request.'
    headers:
      Cache-Control:
        schema:
          type: string
          const: no-store
      Pragma:
        schema:
          type: string
          const: no-cache
      X-Content-Type-Options:
        schema:
          type: string
          const: nosniff
      Vary:
        schema:
          type: string
          const: Cookie, Origin
    content:
      application/json:
        schema:
          allOf:
          - $ref: '#/components/schemas/NativeAccountError'
          - type: object
            properties:
              error:
                type: object
                properties:
                  code:
                    type: string
                    enum:
                    - invalid_request
        examples:
          invalid_request:
            value:
              error:
                code: invalid_request
                message: Request is invalid.
  '429':
    description: 'Applicable native error codes: rate_limited.'
    headers:
      Retry-After:
        description: Conservative delay in seconds for the one-minute rate-limit window.
        schema:
          type: string
          const: '60'
      Cache-Control:
        schema:
          type: string
          const: no-store
      Pragma:
        schema:
          type: string
          const: no-cache
      X-Content-Type-Options:
        schema:
          type: string
          const: nosniff
      Vary:
        schema:
          type: string
          const: Cookie, Origin
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/ErrorBody'
          allOf:
          - $ref: '#/components/schemas/NativeAccountError'
          - type: object
            properties:
              error:
                type: object
                properties:
                  code:
                    type: string
                    enum:
                    - rate_limited
        examples:
          rate_limited:
            value:
              error:
                code: rate_limited
                message: Request rate is exceeded.
  '503':
    description: 'Applicable native error codes: authority_unavailable.'
    headers:
      Cache-Control:
        schema:
          type: string
          const: no-store
      Pragma:
        schema:
          type: string
          const: no-cache
      X-Content-Type-Options:
        schema:
          type: string
          const: nosniff
      Vary:
        schema:
          type: string
          const: Cookie, Origin
    content:
      application/json:
        schema:
          allOf:
          - $ref: '#/components/schemas/NativeAccountError'
          - type: object
            properties:
              error:
                type: object
                properties:
                  code:
                    type: string
                    enum:
                    - authority_unavailable
        examples:
          authority_unavailable:
            value:
              error:
                code: authority_unavailable
                message: Account authority is unavailable.
requestBody:
  required: true
  description: Exact application/json Content-Type; maximum 65536 body bytes and JSON nesting depth
    32.
  content:
    application/json:
      schema:
        $ref: '#/components/schemas/NativeAccountRegistrationFinishInput'
