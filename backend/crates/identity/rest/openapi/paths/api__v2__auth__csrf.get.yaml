                    type: string
                    enum:
                    - invalid_request
        examples:
          invalid_request:
            value:
              error:
                code: invalid_request
                message: Request is invalid.
  '429':
    description: 'Applicable native error codes: rate_limited.'
    headers:
      Cache-Control:
        schema:
          type: string
          const: no-store
      Pragma:
        schema:
          type: string
          const: no-cache
      X-Content-Type-Options:
        schema:
          type: string
          const: nosniff
      Vary:
        schema:
          type: string
          const: Cookie, Origin
    content:
      application/json:
        schema:
          allOf:
          - $ref: '#/components/schemas/NativeAccountError'
          - type: object
            properties:
              error:
                type: object
                properties:
                  code:
                    type: string
                    enum:
                    - rate_limited
        examples:
          rate_limited:
            value:
              error:
                code: rate_limited
                message: Request rate is exceeded.
  '503':
    description: 'Applicable native error codes: authority_unavailable.'
    headers:
      Cache-Control:
        schema:
          type: string
          const: no-store
      Pragma:
        schema:
          type: string
          const: no-cache
      X-Content-Type-Options:
        schema:
          type: string
          const: nosniff
      Vary:
        schema:
          type: string
          const: Cookie, Origin
    content:
      application/json:
        schema:
          allOf:
          - $ref: '#/components/schemas/NativeAccountError'
          - type: object
            properties:
              error:
                type: object
                properties:
                  code:
                    type: string
                    enum:
                    - authority_unavailable
        examples:
          authority_unavailable:
            value:
              error:
                code: authority_unavailable
                message: Account authority is unavailable.
