type: object
required:
- publicKey
properties:
  publicKey:
    $ref: '#/components/schemas/NativeWebAuthnCreationOptions'
description: Complete CreationChallengeResponse from webauthn-rs-proto 0.5.5; serialized intact as
  public_key_options. Native Account additionally requires authenticatorSelection, residentKey=required,
  requireResidentKey=true and userVerification=required; user.id encodes the new Account UUID's 16
  bytes. No expires_at appears in the HTTP wrapper.
