type: object
required:
- id
- rawId
- response
- type
properties:
  id:
    type: string
    description: Pinned String field; do not falsely impose base64 or id==rawId as a parser rule.
      Registration obtains the authoritative credential ID from the attestation.
  rawId:
    $ref: '#/components/schemas/NativeWebAuthnInputBytes'
  response:
    $ref: '#/components/schemas/NativeWebAuthnAttestationResponse'
  type:
    type: string
    description: Canonical browser value public-key; pinned decoder field is String, not an enum.
  extensions:
    $ref: '#/components/schemas/NativeWebAuthnRegistrationClientExtensions'
  clientExtensionResults:
    $ref: '#/components/schemas/NativeWebAuthnRegistrationClientExtensions'
not:
  required:
  - extensions
  - clientExtensionResults
description: Canonical RegisterPublicKeyCredential object. extensions may be omitted and defaults
  to empty outputs; clientExtensionResults is an accepted alias, never both. Explicit null for the
  outer extensions object is rejected. Unknown nested fields accepted. Serde also accepts positional
  structs; this published canonical object schema is not a complete accepted-language grammar.
