      action_keys:
        type: array
        items: {type: string}
      action_refs:
        type: array
        items: {$ref: '#/components/schemas/NativeCompanyActionRef'}
      delegable_action_keys:
        type: array
        items: {type: string}
      delegable_action_refs:
        type: array
        items: {$ref: '#/components/schemas/NativeCompanyActionRef'}
      company_property_keys:
        type: array
        items: {type: string}
      company_property_refs:
        type: array
        items: {$ref: '#/components/schemas/NativeCompanyPropertyRef'}
      delegable_company_property_keys:
        type: array
