type: object
required:
- id
- rawId
- response
- type
properties:
  id:
    type: string
  rawId:
    $ref: '#/components/schemas/NativeWebAuthnInputBytes'
  response:
    $ref: '#/components/schemas/NativeWebAuthnAssertionResponse'
  type:
    type: string
    description: Canonical browser value public-key; pinned decoder field is String.
  extensions:
    $ref: '#/components/schemas/NativeWebAuthnAuthenticationClientExtensions'
  clientExtensionResults:
    $ref: '#/components/schemas/NativeWebAuthnAuthenticationClientExtensions'
not:
  required:
  - extensions
  - clientExtensionResults
description: Canonical PublicKeyCredential object. extensions defaults to empty outputs; clientExtensionResults
  alias accepted, both names together rejected as duplicate. Unknown fields ignored; positional-struct
  forms are also decoder variants, documented separately.
