# ADR-0039 / DN-0005 P3: serial minority for cluster-global mutators.
# Only these filters use max-threads = 1; the rest stay parallel.
#
# CI pin: cargo-nextest 0.9.138 (install via taiki-e/install-action tool=nextest@0.9.138).
# Local: `cargo install cargo-nextest --locked --version 0.9.138` or newer compatible.

[test-groups.cluster-global]
max-threads = 1

# binary(), NOT test(). `test()` matches TEST NAMES; every name below is a test
# BINARY name, so the old `test(/apalis_adapter/)` form grouped only the tests whose
# own name happened to contain the binary name. Measured 2026-08-18 with
# `cargo nextest show-config test-groups`: apalis_adapter 1 of 4 tests grouped,
# apalis_schema_contract 1 of 1, and leave_migration_expand_contract 0 of 9 -- the
# serial control covered 2 of 14 tests across those binaries while reading as if it
# covered all of them. With binary() the same three report 4/4, 1/1 and 9/9.
[[profile.default.overrides]]
filter = '''
  binary(leave_migration_expand_contract)
  + binary(key_revision_migration_upgrade)
  + binary(attendance_console_migration_contract)
  + binary(apalis_adapter)
  + binary(apalis_schema_contract)
  + binary(group_of_one_expand_contract)
  + binary_id(=console-app::audit_api)
  + binary_id(=console-app::console_route_telemetry)
  + binary_id(=console-app::evaluation_cycle_api)
  + binary_id(=console-app::health_readiness)
  + binary_id(=console-comms-rest::readiness)
  + binary_id(=console-consulting-rest::audit_atomicity)
  + binary_id(=console-financial-rest::purchase_request_list)
  + binary_id(=console-identity-adapter-postgres::deactivate_revokes_credentials)
  + binary_id(=console-identity-rest::org_setup)
  + binary_id(=console-inbox-rest::api)
  + binary_id(=console-leave-rest::leave_http_personas)
  + binary_id(=console-messenger-rest::api)
  + binary_id(=console-notices-rest::api)
  + binary_id(=console-notifications-rest::api)
  + binary_id(=console-ontology-rest::object_policy_attach_as_runtime_role)
  + binary_id(=console-ontology-rest::object_type_cas_as_runtime_role)
  + binary_id(=console-ontology-rest::object_type_lifecycle_over_http)
  + binary_id(=console-payroll-rest::api)
  + binary_id(=console-payroll-rest::payslip_draft_api)
  + binary_id(=console-payroll-rest::run_lifecycle_api)
  + binary_id(=console-platform-auth::auth7_legacy_projection)
  + binary_id(=console-platform-auth::refresh_tokens)
  + binary_id(=console-platform-auth::webauthn_ceremony)
  + binary_id(=console-platform-auth::webauthn_ceremony_replay)
  + binary_id(=console-platform-auth::webauthn_registration_deactivated_user)
  + binary_id(=console-platform-provisioning::bootstrap_passkey)
  + binary_id(=console-platform-provisioning::bootstrap_passkey_replay)
  + binary_id(=console-platform-provisioning::rls_auth_chain_as_runtime_role)
  + binary_id(=console-platform-provisioning::roster_import)
  + binary_id(=console-platform-provisioning::self_enroll_handoff_as_runtime_role)
  + binary_id(=console-platform-rest::onboard_seeds_config_objects)
  + binary_id(=console-platform-rest::ops_dashboard)
  + binary_id(=console-platform-rest::platform_groups)
  + binary_id(=console-platform-rest::remove_tenant)
  + binary_id(=console-platform-rest::view_as)
  + binary_id(=console-production-rest::production_lifecycle_http)
  + binary_id(=console-registry-rest::equipment_admin)
  + binary_id(=console-support-rest::authz)
  + binary_id(=console-support-rest::intake)
  + binary_id(=console-workorder-rest::mobile_device_registration)
  + binary_id(=console-workorder-rest::mobile_evidence)
  + binary_id(=console-workorder-rest::mobile_sync)
'''
test-group = 'cluster-global'

[profile.ci]
# Hosted: no flake-hide retries. Slow timeout generous for PG.
slow-timeout = { period = "120s", terminate-after = 3 }

# census_binds_to_an_executed_database is EIGHT sequential migrate+enforce
# cycles against a Docker PostgreSQL in one test -- the mutation matrix for the
# canonical-enforcement census. Measured 263s locally and it hit the 360s
# terminate ceiling on a hosted runner the first time every shard ran under
# nextest. That cost is legitimate and serial by construction (each cycle
# re-installs the topology script), so the ceiling is raised for THIS binary
# only. The global 360s stays: it is what catches a genuinely hung test, and
# widening it everywhere to accommodate one known-slow suite would hide hangs
# in the other 153.
[[profile.ci.overrides]]
filter = 'binary(census_executes_against_postgres)'
slow-timeout = { period = "120s", terminate-after = 8 }
